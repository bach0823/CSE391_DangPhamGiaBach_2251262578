<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng ký thành viên</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
</head>
<body class="bg-light py-5">
    <div class="container" style="max-width: 500px;">
        <div class="card p-4 shadow-sm">
            <h3 class="mb-4 text-center text-primary">Đăng ký tài khoản</h3>
            <form id="registerForm">
                <!-- Tên -->
                <div class="mb-3">
                    <label for="fullName" class="form-label">Họ và tên</label>
                    <div class="input-group">
                        <input type="text" id="fullName" class="form-control" placeholder="Nhập họ tên" required>
                        <span id="nameStatus" class="input-group-text"></span>
                    </div>
                    <div id="nameFeedback" class="small text-danger mt-1"></div>
                </div>

                <!-- Email -->
                <div class="mb-3">
                    <label for="email" class="form-label">Email</label>
                    <input type="email" id="email" class="form-control" placeholder="email@example.com" required>
                    <div id="emailFeedback" class="small text-danger mt-1"></div>
                </div>

                <!-- Mật khẩu -->
                <div class="mb-3">
                    <label for="password" class="form-label">Mật khẩu</label>
                    <input type="password" id="password" class="form-control" placeholder="Ít nhất 8 ký tự" required>
                    <div class="progress mt-2" style="height: 6px;">
                        <div id="strengthBar" class="progress-bar" role="progressbar" style="width: 0%;"></div>
                    </div>
                    <div id="passwordFeedback" class="small mt-1"></div>
                </div>

                <!-- Xác nhận mật khẩu -->
                <div class="mb-3">
                    <label for="confirmPassword" class="form-label">Xác nhận mật khẩu</label>
                    <input type="password" id="confirmPassword" class="form-control" placeholder="Nhập lại mật khẩu" required>
                    <div id="confirmFeedback" class="small text-danger mt-1"></div>
                </div>

                <!-- Số điện thoại -->
                <div class="mb-3">
                    <label for="phone" class="form-label">Số điện thoại</label>
                    <input type="text" id="phone" class="form-control" placeholder="Ví dụ: 0901-234-567" required maxlength="12">
                    <div id="phoneFeedback" class="small text-danger mt-1"></div>
                </div>

                <button type="submit" id="submitBtn" class="btn btn-primary w-100" disabled>Đăng ký</button>
            </form>
        </div>
    </div>

    <!-- Modal báo đăng ký thành công -->
    <div id="successModal" class="modal" tabindex="-1" style="background: rgba(0,0,0,0.5); display: none; align-items: center; justify-content: center; position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 1050;">
        <div class="modal-dialog" style="max-width: 450px; width: 90%; margin: auto;">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title text-success">🎉 Đăng ký thành công!</h5>
                    <button type="button" class="btn-close" id="closeModalBtn"></button>
                </div>
                <div class="modal-body">
                    <p><strong>Thông tin đăng ký của bạn:</strong></p>
                    <ul class="list-group list-group-flush">
                        <li class="list-group-item">Họ tên: <span id="modalName"></span></li>
                        <li class="list-group-item">Email: <span id="modalEmail"></span></li>
                        <li class="list-group-item">Số điện thoại: <span id="modalPhone"></span></li>
                    </ul>
                </div>
            </div>
        </div>
    </div>

    <script src="./app.js"></script>
</body>
</html>
