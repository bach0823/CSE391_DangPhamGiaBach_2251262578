<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Bài tập B4</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
</head>
<body class="container py-4">
    <h3>Gallery ảnh và phím tắt</h3>
    <p>Nhấn <b>Ctrl + K</b> để mở bảng lệnh. Phím mũi tên trái/phải để chuyển ảnh. Phím Space để bật/tắt slideshow. Nhấn phím 1-9 để chọn nhanh ảnh. Nhấn Esc để đóng modal/bảng lệnh.</p>

    <div class="text-center bg-secondary p-3 rounded">
        <img id="mainImage" src="" alt="Ảnh" class="img-fluid rounded" style="max-height: 400px; cursor: pointer;" tabindex="0">
        <div class="mt-2 text-white" id="slideshowStatus">Trạng thái: Dừng</div>
    </div>

    <div class="d-flex justify-content-center gap-2 mt-3">
        <button id="prevBtn" class="btn btn-primary" aria-label="Ảnh trước">Trước</button>
        <button id="playPauseBtn" class="btn btn-success" aria-label="Slideshow">Phát Slideshow</button>
        <button id="nextBtn" class="btn btn-primary" aria-label="Ảnh sau">Sau</button>
    </div>

    <div id="thumbnailsContainer" class="d-flex justify-content-center gap-2 mt-3" aria-label="Thumbnails">
    </div>

    <div id="imgModal" class="position-fixed top-0 start-0 w-100 h-100 bg-dark bg-opacity-75" style="display: none; z-index: 1050; align-items: center; justify-content: center;" role="dialog" aria-modal="true" aria-label="Xem ảnh lớn">
        <div class="bg-white p-2 rounded text-center">
            <img id="modalImg" src="" alt="Lớn" class="img-fluid" style="max-height: 80vh;">
            <br>
            <button id="closeModalBtn" class="btn btn-danger mt-2">Đóng</button>
        </div>
    </div>

    <div id="cmdPalette" class="position-fixed top-0 start-0 w-100 h-100 bg-dark bg-opacity-50" style="display: none; z-index: 1060; align-items: flex-start; justify-content: center; padding-top: 50px;" role="dialog" aria-modal="true" aria-label="Bảng lệnh">
        <div class="card p-3" style="width: 400px;">
            <input type="text" id="cmdInput" class="form-control mb-2" placeholder="Gõ lệnh ở đây..." aria-label="Nhập lệnh">
            <div id="cmdList" class="list-group">
            </div>
            <div class="text-muted small mt-2">Dùng mũi tên lên/xuống, nhấn Enter để chọn.</div>
        </div>
    </div>

    <script src="./app.js"></script>
</body>
</html>
