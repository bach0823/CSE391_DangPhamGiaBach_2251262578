<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Danh bạ thành viên</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
</head>
<body class="bg-light py-5">
    <div class="container" style="max-width: 800px;">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h3 class="text-primary m-0">Quản lý thành viên</h3>
            <button id="addUserBtn" class="btn btn-success" data-bs-toggle="modal" data-bs-target="#userModal">Thêm thành viên</button>
        </div>

        <!-- Alert thong bao loi/thanh cong -->
        <div id="alertBox" class="alert d-none" role="alert"></div>

        <!-- O tim kiem -->
        <div class="mb-4">
            <input type="text" id="searchInput" class="form-control" placeholder="Tìm kiếm theo tên hoặc email...">
        </div>

        <!-- Skeleton Loading State -->
        <div id="skeletonLoader" class="row g-3">
            <div class="col-md-6">
                <div class="card p-3 placeholder-glow">
                    <span class="placeholder col-6 mb-2"></span>
                    <span class="placeholder col-8"></span>
                </div>
            </div>
            <div class="col-md-6">
                <div class="card p-3 placeholder-glow">
                    <span class="placeholder col-4 mb-2"></span>
                    <span class="placeholder col-7"></span>
                </div>
            </div>
        </div>

        <!-- Khuvuc hien thi danh sach user -->
        <div id="userList" class="row g-3 mt-2">
            <!-- JS se render list user vao day -->
        </div>
    </div>

    <!-- Modal Form (Add / Edit) -->
    <div class="modal fade" id="userModal" tabindex="-1" aria-labelledby="userModalLabel" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="userModalLabel">Thêm thành viên mới</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <form id="userForm">
                        <input type="hidden" id="userId">
                        <div class="mb-3">
                            <label for="userName" class="form-label">Họ và tên</label>
                            <input type="text" class="form-control" id="userName" required>
                        </div>
                        <div class="mb-3">
                            <label for="userEmail" class="form-label">Email</label>
                            <input type="email" class="form-control" id="userEmail" required>
                        </div>
                        <div class="d-flex justify-content-end gap-2">
                            <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Hủy</button>
                            <button type="submit" class="btn btn-primary" id="saveBtn">Lưu</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <!-- Nhap them JS cua Bootstrap de dieu khien modal popup -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="./app.js"></script>
</body>
</html>
