<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Thời tiết App</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
</head>
<body class="bg-light py-5">
    <div class="container" style="max-width: 500px;">
        <div class="card p-4 shadow-sm mb-4">
            <h3 class="text-center text-primary mb-4">Dự báo thời tiết</h3>
            
            <form id="searchForm" class="d-flex gap-2 mb-3">
                <input type="text" id="cityInput" class="form-control" placeholder="Nhập tên thành phố (vd: Hanoi, Tokyo...)" required>
                <button type="submit" class="btn btn-primary">Tìm</button>
            </form>

            <div id="historyContainer" class="mb-3">
                <small class="text-muted">Lịch sử tìm kiếm:</small>
                <div id="historyList" class="d-flex gap-2 flex-wrap mt-1">
                </div>
            </div>
        </div>

        <!-- Vung hien thi cac trang thai -->
        <div id="statusContainer">
            <!-- Loading state -->
            <div id="loadingState" class="text-center py-4" style="display: none;">
                <div class="spinner-border text-primary" role="status"></div>
                <div class="mt-2 text-muted">Đang tải dữ liệu thời tiết...</div>
            </div>

            <!-- Error state -->
            <div id="errorState" class="alert alert-danger py-3" style="display: none;" id="errorMessage">
                Không tìm thấy thành phố hoặc lỗi kết nối. Vui lòng thử lại!
            </div>

            <!-- Success state -->
            <div id="successState" class="card p-4 shadow-sm text-center" style="display: none;">
                <h4 id="cityName" class="text-secondary fw-bold">Hanoi</h4>
                <div id="weatherIcon" class="fs-1 my-2">☀️</div>
                <div id="weatherDesc" class="fs-5 text-muted mb-3">Trời quang đãng</div>
                <div class="row border-top pt-3 mt-2">
                    <div class="col-6 border-end">
                        <small class="text-muted">Nhiệt độ</small>
                        <div id="temperature" class="fs-4 fw-bold text-danger">--°C</div>
                    </div>
                    <div class="col-6">
                        <small class="text-muted">Độ ẩm</small>
                        <div id="humidity" class="fs-4 fw-bold text-info">--%</div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="./app.js"></script>
</body>
</html>
