<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Thư viện ảnh cuộn vô hạn</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <style>
        /* focus ring va thumbnail custom */
        .photo-card {
            cursor: pointer;
            overflow: hidden;
            transition: transform 0.2s;
        }
        .photo-card:hover {
            transform: scale(1.03);
        }
    </style>
</head>
<body class="bg-light py-5">
    <div class="container">
        <h3 class="text-center text-primary mb-5">Thư viện ảnh đẹp</h3>

        <!-- Luoi anh -->
        <div id="galleryGrid" class="row g-4">
            <!-- JS se render danh sach anh o day -->
        </div>

        <!-- Trigger cuon trang va loading indicator -->
        <div id="load-trigger" class="text-center py-5">
            <div id="spinner" class="spinner-border text-primary" role="status"></div>
            <div class="mt-2 text-muted">Đang tải thêm ảnh...</div>
        </div>
    </div>

    <!-- Modal Lightbox hien thi anh lon -->
    <div id="lightboxModal" class="position-fixed top-0 start-0 w-100 h-100 bg-dark bg-opacity-90" style="display: none; z-index: 1050; align-items: center; justify-content: center;" role="dialog" aria-modal="true" aria-label="Xem ảnh phóng to">
        <button id="closeLightboxBtn" class="btn btn-light position-absolute top-0 end-0 m-4 fs-3 fw-bold" style="border-radius: 50%; width: 45px; height: 45px; line-height: 30px;">×</button>
        <div class="text-center">
            <img id="lightboxImg" src="" alt="Ảnh lớn" class="img-fluid rounded shadow" style="max-height: 85vh; max-width: 90vw; object-fit: contain;">
            <p id="lightboxAuthor" class="text-white mt-2 fs-5">Tác giả</p>
        </div>
    </div>

    <script src="./app.js"></script>
</body>
</html>
